version: 2

snapshots:
  - name: sales_history
    relation: ref('int_silver_sales')

    config:
      schema: snapshots
      file_format: delta

      unique_key: source_record_key
      strategy: check

      check_cols:
        - sales_id
        - date_sk
        - store_sk
        - product_sk
        - customer_sk
        - promotion_sk
        - quantity
        - unit_price
        - gross_amount
        - discount_amount
        - net_amount
        - payment_method