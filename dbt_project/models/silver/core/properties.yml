version: 2

models:
  - name: silver_sales
    description: "Vendas validadas e prontas para consumo analítico."

    columns:
      - name: source_record_key
        description: "UUID estável do registro de venda na origem."
        data_tests:
          - not_null
          - unique

      - name: sales_id
        description: "Identificador de negócio da venda."
        data_tests:
          - not_null
          - unique

      - name: date_sk
        data_tests:
          - not_null

      - name: store_sk
        data_tests:
          - not_null

      - name: product_sk
        data_tests:
          - not_null

      - name: customer_sk
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

      - name: gross_amount
        data_tests:
          - not_null

      - name: discount_amount
        data_tests:
          - not_null

      - name: net_amount
        data_tests:
          - not_null

      - name: payment_method
        data_tests:
          - not_null